	<title>CSC 225 - Lab 4</title>
</head>

<body>

	<div class="jumbotron jumbotron-fluid">
		<div class="container">
			<center>
				<h1 class="display-4">Javascript Incorporation Lab</h1>
				<p class="lead">Donald Salvato</p>
			</center>
		</div>
	</div>
	
	<ul class="nav justify-content-center">
		<li class="nav-item">
		<a class="nav-link active" aria-current="page" href="#">Navigation</a>

		<li class="nav-item">
		<a class="nav-link disabled" aria-disabled="true">Lab 4</a>
		</li>
	</ul>
	<br>
	
	<div class="container">
		<div class="col-12">
			<p>Good <span id="greeting"></span> <span id="username"></span>, thank you for your order.</p>
			<p>You ordered <span id="itemNum"></span> of the item <span id="itemTitle"></span>.</p>
			<p>It will be delivered by <span id="date"></span>.</p>
		</div>
	</div>
	
	<hr>
	<p class="text-center">October 14, 2026 by Donald Salvato</p>
	
	<script>
		alert("Welcome! Please answer the following questions to place your order.");
		const userName = prompt("Please enter your name:");
		const itemName = prompt("Please enter your requested item:");
		const itemQuant = prompt("Please enter the quantity of items you would like");
		
		document.getElementById("username").innerText = userName;
		document.getElementById("itemTitle").innerText = itemName;
		document.getElementById("itemNum").innerText = itemQuant;
		
		const currentHour = new Date().getHours();
		let timeGreet = "day";
		if (currentHour < 12) {
        timeGreet = "morning";
		} else {
        timeGreet = "afternoon";
		}
		document.getElementById("greeting").innerText = timeGreet;
		
		const delivery = new Date();
		delivery.setDate(delivery.getDate() + 7);
		document.getElementById("date").innerText = delivery.toDateString();
	</script>
